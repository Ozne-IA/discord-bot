<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Statut — __BOT_NAME__</title>
  <meta name="description" content="État du bot en direct : en ligne, latence, serveurs.">
  <meta property="og:type" content="website">
  <meta property="og:title" content="Statut de __BOT_NAME__">
  <meta property="og:description" content="Le bot est-il en ligne ? État en direct.">
  <meta property="og:image" content="__ORIGIN__/og.png">
  <meta name="theme-color" content="#5865f2">
  <link rel="icon" href="/favicon.png">
  <script src="/static/theme.js"></script>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <header class="topbar">
    <a class="brand" href="/"><img id="bot-avatar-small" alt=""><span class="bot-name">__BOT_NAME__</span></a>
    <nav class="site-nav"><a href="/#fonctions">Fonctions</a><a href="/commands">Commandes</a><a href="/premium">Premium</a><a href="/status" class="on">Statut</a></nav>
    <div class="spacer"></div>
    <a class="btn primary small" href="/dashboard">Panel</a>
  </header>

  <main class="section" style="max-width:820px">
    <h2>📡 Statut du bot</h2>
    <p class="sub">Mis à jour automatiquement toutes les 30 secondes.</p>
    <div class="status-big"><span class="status-dot" id="dot"></span><span id="state">Vérification…</span></div>
    <div class="cards">
      <div class="stat"><b id="latency">–</b><span>latence Discord</span></div>
      <div class="stat"><b id="uptime">–</b><span>en ligne depuis</span></div>
      <div class="stat"><b id="guilds">–</b><span>serveurs</span></div>
      <div class="stat"><b id="members">–</b><span>membres</span></div>
      <div class="stat"><b id="modules">–</b><span>modules chargés</span></div>
      <div class="stat"><b id="version">–</b><span>version</span></div>
    </div>
    <p class="muted center" style="font-size:13px" id="checked"></p>
  </main>

  <footer class="site"><a href="/">Page d'accueil</a> · <a href="/commands">Commandes</a> · <a href="/premium">Premium</a> · <a href="/dashboard">Panel de configuration</a></footer>

  <script src="/static/i18n.js"></script>
  <script>
    "use strict";
    const $ = (id) => document.getElementById(id);
    const fmt = (n) => n.toLocaleString(LANG === "en" ? "en-GB" : "fr-FR");
    function duration(s) {
      const d = Math.floor(s / 86400), h = Math.floor((s % 86400) / 3600), m = Math.floor((s % 3600) / 60);
      const day = LANG === "en" ? "d" : "j";
      return d ? `${d} ${day} ${h} h` : h ? `${h} h ${m} min` : `${m} min`;
    }
    function check() {
      fetch("/api/status", { cache: "no-store" }).then((r) => r.ok ? r.json() : Promise.reject()).then((s) => {
        $("dot").className = "status-dot " + (s.online ? "on" : "off");
        $("state").textContent = translateText(s.online ? "En ligne" : "Le bot redémarre ou est déconnecté de Discord");
        $("latency").textContent = s.latency_ms == null ? "–" : `${s.latency_ms} ms`;
        $("uptime").textContent = duration(s.uptime);
        $("guilds").textContent = fmt(s.guilds);
        $("members").textContent = fmt(s.members);
        $("modules").textContent = s.modules;
        $("version").textContent = s.version;
        $("checked").textContent = translateText("Dernière vérification") + " : " + new Date().toLocaleTimeString(LANG === "en" ? "en-GB" : "fr-FR");
      }).catch(() => {
        $("dot").className = "status-dot off";
        $("state").textContent = translateText("Hors ligne : le serveur ne répond pas");
      });
    }
    check();
    setInterval(check, 30000);
    fetch("/api/public").then((r) => r.ok ? r.json() : Promise.reject()).then((info) => {
      document.querySelectorAll(".bot-name").forEach((n) => n.textContent = info.name);
      if (info.avatar) $("bot-avatar-small").src = info.avatar;
    }).catch(() => {});
  </script>
</body>
</html>
